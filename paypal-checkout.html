  <script>
    $.ajax({
        url: "https://cdn.jsdelivr.net/gh/mariotti8/deplace-maison@3228077/index-handwritten-2.html",
        success: function (result) {
            $("#draw-svg").html(result);
        }
    });
    const promo1 = document.getElementById('ink-wrapper-1');
    const promo2 = document.getElementById('ink-wrapper-2');
    const promo1Normal = document.getElementById('wrapper-1');
    const promo2Normal = document.getElementById('wrapper-2');
    const letters = document.querySelectorAll('.head-1');
    let isInkMode = false;
    let state = 'startState';
    let cursorSize = 60;
    //is Mobile, is Tablet 
    const isTablet = window.matchMedia("(max-width: 991px)");
    const isMobile = window.matchMedia("(max-width: 479px)");
    const mediaObserver = () => {
        if (isMobile.matches) {
            cursorSize = 20;
        } else if (isTablet.matches) {
            cursorSize = 50;
        } else {
            cursorSize = 60
        }
    }
    mediaObserver();
    isTablet.addListener(mediaObserver);
    isMobile.addListener(mediaObserver);
    const _inkMode = function (letter) {
        if (isInkMode) {
            letter.classList.add('active-letter');
        }
    }
    function change() {
        if (state === "startState") {
            $('#ink-wrapper-1').wScratchPad({
                size: cursorSize,
                bg: manBack,
                realtime: true,
                fg: manFront,
                cursor: 'none',
                scratchMove: function (e, percent) {
                    if ((percent > 70)) {
                        const x = document.getElementById('ink-wrapper-1');
                        x.getElementsByTagName('canvas')[0].style.opacity = '0'
                    }
                }
            });
            $('#ink-wrapper-2').wScratchPad({
                size: cursorSize,
                bg: wmnsBack,
                realtime: true,
                fg: wmnsFront,
                cursor: 'none',
                scratchMove: function (e, percent) {
                    if ((percent > 70)) {
                        const x = document.getElementById('ink-wrapper-2');
                        x.getElementsByTagName('canvas')[0].style.opacity = '0'
                    }
                }
            });
        }
        if (state === 'normal' || state === "startState") {
            promo1.style.display = 'block';
            promo2.style.display = 'block';
            $('#ink-wrapper-1').wScratchPad('reset');
            $('#ink-wrapper-2').wScratchPad('reset');
            promo1Normal.style.display = 'none';
            promo2Normal.style.display = 'none';
            isInkMode = true;
            letters.forEach((letter, index) => {
                letter.addEventListener('mouseover', () => _inkMode(letter), true)
            });
            state = "special"
        } else {
            promo1.style.display = 'none';
            promo2.style.display = 'none';
            promo1Normal.style.display = 'block';
            promo2Normal.style.display = 'block';
            isInkMode = false;
            letters.forEach((letter, index) => {
                letter.removeEventListener('mouseover', () => _inkMode(letter), true)
                letter.classList.remove('active-letter');
            });
            state = "normal"
        }
    }
    const getUrl = window.location;
    const baseUrl = getUrl.protocol + "//" + getUrl.host;
    $('.grid-slider-list').flickity({
        contain: true,
        prevNextButtons: false,
        pageDots: false,
        bgLazyLoad: 1,
        selectedAttraction: 0.01,
        friction: 0.15,
    });
    const $carousel = $('.grid-slider-list').flickity();
    const flkty = $carousel.data('flickity');
    flkty.on('staticClick', function (event, pointer, cellElement, cellIndex) {
        const name = cellElement.querySelector('.item-name').innerHTML.trim('').toLowerCase();
        const type = cellElement.querySelector('.item-gender').innerHTML.trim('').toLowerCase();
        const color = cellElement.querySelector('.item-black').classList.contains('w-condition-invisible') ?
            'white' : 'black'
        if (type === 'unisex') {
            mouseTixme = 0;
            window.location.href = `${baseUrl}/product/${name}-${color}`
        } else {
            window.location.href = `${baseUrl}/product/${name}-${type}-${color}`
        }
    });
</script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Only run this on the LEGO Super Mario page
    if (window.location.pathname === '/lego-supermario') {
      const iframe = document.querySelector('.iphone-video-screen iframe');
      if (!iframe) return;
      const src = iframe.getAttribute('src');
      const playVideo = () => {
        if (!src.includes('autoplay=1')) {
          iframe.setAttribute('src', src + '&autoplay=1');
        }
      };
      // Trigger autoplay on first scroll or tap
      window.addEventListener('scroll', playVideo, { once: true });
      window.addEventListener('touchstart', playVideo, { once: true });
    }
  });
</script>
